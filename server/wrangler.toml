# 시간표 서버 설정 — 자세한 설치 방법은 ../README.md
name = "timetable-server"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# 시간표 앱 주소만 이 서버를 쓰게 막기 (쉼표로 여러 개). 비우면 아무 주소에서나 부를 수 있어요.
ALLOWED_ORIGINS = "https://ssea3030g-debug.github.io"

# 데이터는 Durable Object 한 개(SQLite)에 저장돼요. 따로 만들 저장소 ID는 필요 없어요.
[[durable_objects.bindings]]
name = "STATE"
class_name = "StateStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StateStore"]

# 비밀번호 무차별 대입 막기: 같은 주소에서 1분에 30번까지
[[ratelimits]]
name = "LIMITER"
namespace_id = "2001"
  [ratelimits.simple]
  limit = 30
  period = 60

# 비밀값은 여기 쓰지 말고 명령으로 넣으세요:
#   npx wrangler secret put APP_PASSCODE
