# 시간표 앱(timetable-app/)을 GitHub Pages 에 올림
# 준비 (한 번만): 공개(public) 저장소의 Settings → Pages → Build and deployment → Source: "GitHub Actions"
# (이 저장소는 공개라서 무료로 Pages 를 쓸 수 있음)
name: 시간표 앱 배포 (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["timetable-app/**", ".github/workflows/timetable.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: timetable-app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
